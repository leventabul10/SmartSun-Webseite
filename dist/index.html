<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SmartSun GmbH – Sonnenschutz, Wetterschutz und Sichtschutz aus Destedt."
    />
    <link rel="icon" type="image/svg+xml" href="/assets/logo-dark.svg" />
    <title>SmartSun GmbH</title>
    <script>
      try {
        const stored = localStorage.getItem('smartsun-theme');
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.dataset.theme = stored;
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (error) {
        // Theme bleibt dann automatisch im hellen Modus.
      }
    </script>
    <script type="module" crossorigin src="/assets/index-CidX-pxs.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D-KoGSn4.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
